[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dominion-theory"
version = "1.0.0"
description = "A simple strategic game"
readme = "README.md"
requires-python = ">=3.13, <3.14"
license = {text = "Private/Proprietary"}

authors = [
    {name = "Oberon Systems", email = "info@oberon.systems"}
]

maintainers = [
    {name = "Zombig", email = "me@zombig.name"}
]

classifiers = [
    "Programming Language :: Python",
    "License :: OSI Approved :: Private/Proprietary",
    "Operating System :: POSIX :: Linux",
]

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
