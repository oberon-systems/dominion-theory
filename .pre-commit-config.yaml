# commit-msg hook scripts are only written by `pre-commit install` when it is
# asked for that type.
default_install_hook_types: [pre-commit, commit-msg]

# A hook that declares no stage runs in every installed one, so at commit-msg
# it would lint .git/COMMIT_EDITMSG instead of the tree.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - alembic==1.20.0
          - click==8.5.0
          - deepdiff==9.1.0
          - fakeredis==2.39.0
          - fastapi==0.143.0
          - fluent.runtime==0.4.0
          - httpx==0.28.1
          - numpy==2.5.3
          - pydantic==2.14.0
          - pydantic-settings==2.15.0
          - pytest==9.1.1
          - sqlmodel==0.0.48
          - types-PyYAML==6.0.12.20260906
          - valkey==6.1.1

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.40
    hooks:
      - id: pymarkdown
        args: [scan]

  # Tables stay plain; a change of a column's type is agreed with the user first.
  - repo: local
    hooks:
      - id: plain-tables
        name: Keep relations and alterations out of migrations
        language: pygrep
        entry: (?i)foreign_?key|references|cascade|add_column|drop_column|rename_table|alter\s+table
        files: ^src/dominion_theory/db/migrations/versions/

  # `cz check` needs the wyld_cz provider .cz.yaml names, pinned in requirements.txt.
  - repo: local
    hooks:
      - id: commitizen
        name: Check the commit message
        entry: .venv/bin/cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
