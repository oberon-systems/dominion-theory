resources:
  water: {kind: water, property: water, weight_kg: 1.0, spoils: {days: 5}}
  forage: {kind: food, property: food, weight_kg: 1.0, spoils: {days: 3}}
  # Hunted, not gathered; the chance a member falls sick of a ration of it.
  meat: {kind: food, weight_kg: 1.0, spoils: {days: 2}, sickens: 0.03}
  stones:
    kind: goods
    property: stone
    weight_kg: 0.5
    # The food a stone of quality 1 cuts; one of quality 0.5 cuts half of it.
    wears: {eaten: 300}
    quality:
      mountain: {min: 0.8, max: 1.0}
      outcrops: {min: 0.65, max: 0.9}
      hills: {min: 0.5, max: 0.75}
    keep: {per: head, amount: 0.3}
    gives:
      - {to: band, path: units.band.consumption_per_day.forage, times: 0.9}
      - {to: band, path: units.band.people.age.begins, plus: {years: 1}}
  sticks:
    kind: goods
    property: wood
    weight_kg: 1.0
    spoils: {years: 1}
    # The heads a stick keeps for a night in camp, and one stick broken by each attack there.
    wears: {nights: 400, attacks: 1}
    keep: {per: head, amount: 0.3}
    gives:
      - {to: band, path: units.band.threat.camp, times: 0.8}
  herbs:
    kind: goods
    property: plants
    weight_kg: 0.1
    spoils: {months: 2}
    wears: {cures: 1}
    keep: {per: head, amount: 0.2}
  cords:
    kind: goods
    property: plants
    weight_kg: 0.1
    spoils: {months: 6}
    quality:
      floodplain: {min: 0.8, max: 1.0}
      swamp: {min: 0.65, max: 0.9}
      grass: {min: 0.55, max: 0.8}
      forest: {min: 0.5, max: 0.75}
    keep: {per: head, amount: 0.2}
  litters:
    kind: goods
    held: personal
    weight_kg: 4.0
    # The days a litter of quality 1 is pulled on the march.
    wears: {pulled: 70}
    keep: {per: puller, amount: 1.0}
    made: {sticks: 3.0, cords: 2.0}
    gives:
      - {to: member, sex: male, path: units.band.carry_kg, times: 2.0}
      - {to: member, sex: female, path: units.band.carry_kg, times: 1.5}
      - {to: band, path: units.band.speed.base, times: 0.85}
  spears:
    kind: goods
    held: personal
    weight_kg: 1.5
    # The ticks a spear of quality 1 hunts.
    wears: {hunts: 80}
    keep: {per: hunter, amount: 1.0}
    made: {sticks: 1.0, stones: 1.0, cords: 1.0}
  hides:
    kind: goods
    weight_kg: 2.0
    spoils: {months: 12}
    keep: {per: head, amount: 0.2}
  clothes:
    kind: goods
    held: personal
    weight_kg: 2.0
    spoils: {months: 12}
    keep: {per: member, amount: 1.0}
    made: {hides: 1.0, cords: 1.0}
    gives:
      - {to: member, path: units.band.people.injury.per_day, times: 0.7}
      - {to: member, path: units.band.people.exposure.encounter, times: 0.8}
      - {to: member, path: units.band.people.exposure.frailty, times: 0.7, seasons: [winter]}
      - {to: band, path: units.band.threat.camp, times: 0.9}
      - {to: band, path: units.band.threat.march, times: 0.9}
  waterskins:
    kind: goods
    held: personal
    weight_kg: 0.5
    spoils: {months: 6}
    keep: {per: adult, amount: 1.0}
    made: {hides: 1.0, cords: 1.0}
    gives:
      - {to: member, path: units.band.carry_water_kg, plus: 3.0}
      - {to: band, path: resources.water.spoils, times: 1.5}
