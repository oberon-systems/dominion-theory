# commit-msg hook scripts are only written by `pre-commit install` when it is
# asked for that type.
default_install_hook_types: [pre-commit, commit-msg]

# A hook that declares no stage runs in every installed one, so at commit-msg
# it would lint .git/COMMIT_EDITMSG instead of the tree.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - click==8.5.0
          - numpy==2.5.3
          - pytest==9.1.1

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.40
    hooks:
      - id: pymarkdown
        args: [scan]

  # `cz check` needs the wyld_cz provider .cz.yaml names, pinned in requirements.txt.
  - repo: local
    hooks:
      - id: commitizen
        name: Check the commit message
        entry: .venv/bin/cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
