units:
  band:
    start:
      population: 15
      stores: {water: 15, forage: 15}
      biomes: [grass, forest, floodplain]
      stage: adult
      # The oldest at the start becomes an elder as the third year begins.
      oldest: {years: 15}
    population:
      least: 5
      wellbeing: {food: 1.0, water: 1.0, safety: 1.0, rest: 1.0}
    people:
      stages:
        child:
          until: {years: 4}
          settles: {months: 7}
          gathers: 0.0
          carries: 0.25
          eats: 0.5
          pace: 0.7
          tires: 1.3
          conceives: false
          votes: false
          dies: {encounter: 3.0, frailty: 1.2, injury: 0.5}
          # A day at birth, nearing the adult's two over the childhood.
          reserve: {food: 1.0, water: 1.0, grows: true}
        adult:
          until: {years: 17}
          gathers: 1.0
          carries: 1.0
          eats: 1.0
          pace: 1.0
          tires: 1.0
          conceives: true
          votes: true
          dies: {encounter: 1.0, frailty: 0.05, injury: 1.0}
          reserve: {food: 2.0, water: 2.0}
        elder:
          gathers: 0.0
          carries: 0.5
          eats: 0.7
          pace: 0.8
          tires: 1.3
          conceives: false
          votes: true
          dies: {encounter: 2.0, frailty: 0.3, injury: 1.5}
          reserve: {food: 1.5, water: 1.5}
      age: {begins: {years: 17}, per_year: 0.15, doubles: {years: 2}}
      injury:
        per_day: 0.002
        heal_in_camp: 2.0
        severities:
          light: {days: 10, pace: 0.8, gathers: 0.7}
          medium: {days: 15, pace: 0.6, gathers: 0.4}
          heavy: {days: 20, pace: 0.4, gathers: 0.2}
        drawn: {light: 0.5, medium: 0.3, heavy: 0.2}
      weakened: {pace: 0.6, gathers: 0.6}
      # A nanny for every five children, rounded up, gathers half by the camp; everyone else gathers.
      roles:
        gatherer: {gathers: 1.0}
        nanny: {gathers: 0.5, cares: 5}
      # One nanny a day goes to gather while someone goes short, and one comes back while the stores feed tomorrow.
      leaves: {back: {days: 1}}
      birth:
        pregnancy: {months: 3}
        pause: {min: {months: 1}, max: {months: 2}}
        conceive_per_day: 0.05
        days: 2.0
        child_survives: 0.5
        mother_dies: 0.05
    carry_kg: 6.0
    gathering: {forage: 3.0, water: 4.0, stones: 0.5, sticks: 1.0}
    consumption_per_day: {forage: 1.0, water: 1.0}
    speed:
      base: 1.2
      slowdown: 0.03
      slowest: 0.3
    roaming: {speed: 0.75, share: 0.5, hunger: 0.8}
    fatigue:
      move: 0.3
      roam: 0.15
      gather: 0.1
      camp: -0.3
      build: 0.15
      slows: 0.5
    camp_parts: [evening, night]
    states:
      tiredness: {begins: 0.8, ends: 0.3}
    sight: 2
    memory: {days: 20}
    dread: {encounter: 0.3, lasts: {days: 20}}
    unease: {gain: 0.1, fade: 0.2}
    route: {margin: 4, threat: 2.0, hunger: 1.0, thirst: 1.0}
    shelter: {encounter: 0.5, frailty: 0.5}
    # What the guard of the band leaves of the threat it meets, in camp and on the march.
    threat: {camp: 1.0, march: 1.0}
    winter_camp:
      # Offered through the winter and the last five days of the autumn, enough to build before it.
      offered: {seasons: [winter], before: {days: 5}}
      build: {days: 2}
      # Gathered from the own cell and the cells around it, a cell away giving afar of a gathering.
      reach: 1
      afar: 1.0
      # What staying in a built camp is worth more to the others than standing on its land.
      kept: 0.2
      threat: 0.5
      spoil: 0.5
      consumption: 0.8
      rest: 1.5
    decisions:
      levels:
        sated: {days: 2, need: 0.1}
        fed: {days: 1, need: 0.4}
        hungry: {days: 0, need: 0.8}
      distance: 0.25
      horizon: 2
      unknown: {food: 0.5, water: 0.5, threat: 0.4, passability: 0.7, stone: 0.1, wood: 0.2}
      idle: 0.05
      wander: {days: 1}
      weights:
        hunger: 1.5
        thirst: 1.2
        # A good wanted pulls the gatherers of a fed band; a hungry band wants none.
        goods: 0.4
        safety: 2.0
        move: 3.0
        momentum: 0.1
        intent: 0.6
