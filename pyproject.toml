[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dominion-theory"
version = "0.0.1"
description = "A strategy game with indirect control"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"

authors = [
    {name = "Oberon Systems", email = "info@oberon.systems"}
]

maintainers = [
    {name = "Zombig", email = "me@zombig.name"}
]

classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
]

dependencies = [
    "alembic>=1.20",
    "click>=8.5",
    "deepdiff>=9.1",
    "fakeredis>=2.39",
    "fastapi>=0.143",
    "fluent.runtime>=0.4",
    "httpx>=0.28",
    "numpy>=2.5",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "pygame-ce>=2.5.8",
    "PyYAML>=6.0.3",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54",
    "valkey>=6.1",
    "websockets>=17.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dominion_theory.content" = ["defaults/*.yaml", "defaults/biomes/*.yaml", "presets/*.yaml"]
"dominion_theory.i18n" = ["locales/*/*.ftl"]

[tool.black]
line-length = 120
target-version = ["py314"]
skip-string-normalization = true

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["dominion_theory"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pygame", "pygame.*"]
ignore_missing_imports = true

# The pygame tools are replaced by the web client and are not worth typing.
[[tool.mypy.overrides]]
module = "dominion_theory.planet.tools.*"
ignore_errors = true

[tool.pymarkdown]
plugins.md013.enabled = false
# Obsidian tags are a line of `#word`, which reads as a heading with no space.
plugins.md018.enabled = false

[tool.pytest.ini_options]
testpaths = ["tests"]
