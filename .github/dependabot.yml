# Weekly update pull requests for the Python tooling and dependencies and for
# the GitHub Actions. Minor and patch updates of one ecosystem come as one.
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][deps]"
    groups:
      pip:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][deps]"
    groups:
      github-actions:
        update-types: [minor, patch]
